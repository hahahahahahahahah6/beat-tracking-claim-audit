[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beat-tracking-claim-audit"
version = "0.1.0"
description = "Offline documentation claim checker"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
beat-tracking-claim-audit = "beat_tracking_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["beat_tracking_claim_audit*", "tests"]
